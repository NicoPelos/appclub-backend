# Entorno mínimo para probar la API: MongoDB con conjunto de réplicas (los cobros usan
# transacciones) y la API. Los puertos quedan solo en loopback.
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env
    environment:
      - NODE_ENV=production
      # Pisa el MONGO_URI del .env (que apunta a localhost, pensado para correr sin Docker):
      # dentro de la red de Compose, MongoDB es el servicio "mongo".
      - MONGO_URI=mongodb://mongo:27017/appclub?replicaSet=rs0
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  mongo:
    image: mongo:6.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:6.0
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    command: >
      mongosh --host mongo:27017 --eval
      "try { rs.status(); print('RS already initiated') }
       catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }"

volumes:
  mongo-data:

# IP real del cliente (#302). El gateway tiene dos listeners que comparten
# todas las locations:
#
#   80 — Tailscale Funnel (localhost:8080 en la Raspi). Se comporta como
#        siempre: agrega $remote_addr al X-Forwarded-For y NO confía en
#        CF-Connecting-IP (cualquiera que entre por el Funnel puede mandarlo).
#   81 — solo cloudflared (Service URL http://gateway:81). No se publica en el
#        compose, así que únicamente lo alcanzan los contenedores de la red
#        interna. Cloudflare pisa CF-Connecting-IP en su edge con la IP real
#        del cliente, así que acá sí se confía en él.
#
# El backend tiene trust proxy = 1: toma como IP del cliente el último
# elemento del X-Forwarded-For. En el 81 ese header se reemplaza (no se
# agrega) por un único valor, la IP de CF-Connecting-IP.

# Si cloudflared no manda el header (no debería pasar), se cae a la IP del
# contenedor que se conectó en vez de mandar un valor vacío.
map $http_cf_connecting_ip $cf_client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

map $server_port $gateway_x_forwarded_for {
  81      $cf_client_ip;
  default $proxy_add_x_forwarded_for;
}

# En el 80 queda vacío, y nginx no envía un proxy_set_header con valor vacío:
# ese listener sigue sin mandar X-Real-IP, igual que antes.
map $server_port $gateway_x_real_ip {
  81      $cf_client_ip;
  default "";
}

server {
  listen 80;
  listen 81;

  # Fotos/archivos de socios pueden pesar varios MB (ver fix del límite de
  # multer) — sin esto, este proxy nuevo reintroduciría un 413 antes de
  # llegar al backend.
  client_max_body_size 25m;

  # /staff y /admin sin barra final: nginx responde 301 a /staff/. Con el
  # redirect absoluto armaba http://<host>:81/staff/ (puerto y esquema del
  # listener interno de cloudflared, #302), y el navegador no podía seguirlo.
  # Relativo, el navegador lo resuelve contra la URL pública (https, sin puerto).
  absolute_redirect off;

  location /admin/ {
    proxy_pass http://superadmin:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $gateway_x_forwarded_for;
    proxy_set_header X-Real-IP $gateway_x_real_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /staff/ {
    proxy_pass http://staff:80;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $gateway_x_forwarded_for;
    proxy_set_header X-Real-IP $gateway_x_real_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://app:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $gateway_x_forwarded_for;
    proxy_set_header X-Real-IP $gateway_x_real_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
